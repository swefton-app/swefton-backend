spring:
  application:
    name: swefton-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    test-connection: ${MAIL_TEST_CONNECTION:false}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      "[mail.smtp.ssl.enable]": ${MAIL_SMTP_SSL_ENABLE:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  email-verification:
    code-ttl-seconds: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:600}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

  google:
    client-id: ${GOOGLE_CLIENT_ID}

  mail:
    from: ${MAIL_FROM}

  storage:
    provider: ${STORAGE_PROVIDER}
    root: ${FILE_UPLOAD_DIR}

  documents:
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}

  images:
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}

media:
  video:
    max-duration-seconds: ${MEDIA_VIDEO_MAX_DURATION_SECONDS}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 200MB
    max-swallow-size: 200MB

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:swefton}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS}

  auth:
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS}
