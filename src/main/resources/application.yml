spring:
  application:
    name: swefton-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
  storage:
    provider: ${STORAGE_PROVIDER}
    root: ${FILE_UPLOAD_DIR}

media:
  video:
    max-duration-seconds: ${MEDIA_VIDEO_MAX_DURATION_SECONDS}

server:
  port: ${SERVER_PORT}
  tomcat:
    max-http-form-post-size: 200MB
    max-swallow-size: 200MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
